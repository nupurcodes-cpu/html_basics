<!-- 1. Semantics (Meaningful Elements)
Yeh tags browser aur search engines ko batate hain ki page ke content ka kya matlab ya purpose hai --><!-- 
<h1> to <h6>: Page par headings dene ke liye use hote hain. 
<p>: Text ko paragraph ke form me likhne ke liye use hota hai.   
<a>: Anchor tag — dusre web pages ya links par jaane ke liye hyperlink banata hai.   
    <ul>: Unordered list — bullet points wali list banane ke liye.   
        <ol>: Ordered list — numbered (1, 2, 3) list banane ke liye.   
            <table>: Webpage par table create karne ke liye.   
                <tr>: Table Row — table ke andar ek horizontal row banata hai.   
                    <td>: Table Data — table row ke andar ek single cell/column me data daalne ke liye.   
                        <img>: Webpage par image/photo display karne ke liye.   
                        <form>: User inputs lene ke liye form container banata hai (jaise login/signup form).   
                            <input>: Form ke andar alag-alag type ke input fields banata hai (e.g., text box, checkbox, button). -->
<!-- 2. Structure (Page Architecture)
Yeh tags poore HTML document ka layout aur structure tay karte hain.    --><!-- 
<html>: Yeh main root element hai jo poore HTML code ko wrap karta hai.   
    <head>: Isme website ka metadata, title, CSS stylesheets, aur scripts ki links hoti hain (yeh screen par dikhta nahi hai).   
        <body>: Page ka saara visible content (text, images, video, links) iske andar hota hai.   
            <header>: Page ya kisi section ka top section (jaise logo, title, ya top menu).   
                <main>: Page ka sabse zaroori/main unique content iske andar likha jata hai.   
                    <aside>: Main content se related side content ke liye (jaise sidebar, ads, ya links).   
                        <footer>: Page ya section ka bottom part (jaise copyright notice, social links, contact info).   
                            <article>: Ek independent/self-contained content block (jaise blog post ya news article).   
                                <section>: Page ke alag-alag thematic sections ko divide karne ke liye.   
                                    <nav>: Navigation links ke group ko define karta hai (main navigation menu).  -->
<!-- 3. Formatting (Text Styling)
Yeh tags text ka visual look, font style, ya placement change karne ke liye use hote hain. --><!--                                         
<b>: Text ko sirf visually bold karne ke liye.   
    <i>: Text ko italic (tircha) karne ke liye.   
        <u>: Text ke neeche underline lagane ke liye.   
            <s>: Text ke beech me strikethrough (line through text) lagane ke liye.   
                <strong>: Text ko bold karne ke saath-saath uski importance ko highlight karne ke liye.   
                    <em>: Emphasized text — text ko italic karke emphasis dene ke liye.   
                        <sup>: Superscript — text ko normal line se thoda upar dikhane ke liye (jaise x^2).   
                            <sub>: Subscript — text ko normal line se thoda neeche dikhane ke liye (jaise H_2O).   
                                <pre>: Preformatted text — code me jaise spaces aur line breaks likhe hain, waise ka waisa screen par dikhata hai.   
                                    <code>: Computer programming code ko monospaced font me dikhane ke liye.   
                                        <br> / <br/>: Line break — text me nayi line lane ke liye (yeh self-closing tag hai).  -->
